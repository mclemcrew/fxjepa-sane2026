<text x="735.2" y="907.86" font-family="Helvetica Now Display, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#191919" text-anchor="start">FX-JEPA gives each stem and effect its own learned query over the audio</text>
