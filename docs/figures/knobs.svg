<title id="title-knobs">Paired bar chart of knob skill, our baseline against the best model, on six knobs: peak freq 0.50 to 0.77, peak gain 0.49 to 0.69, delay time 0.13 to 0.47, room size 0.18 to 0.39, damping 0.03 to 0.18, comp ratio 0.00 to 0.05. Beside each pair, the median miss from our baseline to the best model.</title>
